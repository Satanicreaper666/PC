name: Uptime

# Once a day, check that the live site answers. A failed run emails the repository owner.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Home, a chapter, a calculator and search answer with 200
        env:
          SITE: https://peoplecraft.vercel.app
        run: |
          for path in / /handbooks/labour-law/ /toolkit/gratuity-calculator/ /search/ /changes/rss.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE$path")
            echo "$path $code"
            test "$code" = "200"
          done
